    try { localStorage.setItem('clayMap.traffic', trafficOn ? '1' : '0'); } catch {}
    syncTraffic();
  };
  map.on('load', syncTraffic);

  // Click an incident badge: what's happening + delay
  const BADGE_LAYERS = ['tt-inc-badge', 'tt-inc-badge-minor'];
  map.on('click', BADGE_LAYERS, e => {
    const f = e.features && e.features[0];
    if (!f) return;
    const q = f.properties;
    const what = q.description || q.description_0 || (q.cluster_size ? `${q.cluster_size} incidents here` : 'Traffic incident');
    const delay = +q.delay > 0 ? ` · ${fmtDuration(+q.delay)} delay` : '';
    const box = mk('div', { className: 'pin-pop' });
    box.append(mk('b', { textContent: what }), mk('div', { textContent: (q.road_type || '') + delay }));
    new maplibregl.Popup({ offset: 12, closeButton: false }).setLngLat(f.geometry.coordinates).setDOMContent(box).addTo(map);
  });
  map.on('mouseenter', BADGE_LAYERS, () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', BADGE_LAYERS, () => { map.getCanvas().style.cursor = pinMode ? 'crosshair' : ''; });

  // Live traffic changes: reload the traffic layers every 2 minutes while they're on
  setInterval(() => { if (trafficOn && mapReady) syncTraffic(); }, 120000);

  // ---- Directions ----
  const dirEl = document.getElementById('dir'), dirTo = document.getElementById('dirTo'),
        dirFrom = document.getElementById('dirFrom'), dirSummary = document.getElementById('dirSummary'),
        dirSteps = document.getElementById('dirSteps'), dirPickStart = document.getElementById('dirPickStart'),
        dirUseMe = document.getElementById('dirUseMe');
  const dir = { dest: null, origin: null, mode: 'car', route: null, waitingForMe: false, seq: 0 };
  let destMarker = null, startMarker = null;

  // Called by placeMe(): the first fix of your location starts a route that was waiting for it
  function onMeMoved() {
    if (dir.dest && !dir.origin && dir.waitingForMe) { dir.waitingForMe = false; computeRoute(); }
  }

  function openDirections(dest) {
    if (!TT_KEY) return setStatus('Directions need a TomTom key in config.js', true, 5000);
    dir.dest = dest;
    dirTo.textContent = dest.name || fmt(dest.lat, dest.lng);
    dirTo.title = dirTo.textContent;
    dirEl.hidden = false;
    if (!destMarker) {
      const el = document.createElement('div'); el.className = 'dest-pin';
      destMarker = new maplibregl.Marker({ element: el, anchor: 'bottom', offset: [0, -2] });
    }
    destMarker.setLngLat([dest.lng, dest.lat]).addTo(map);
    computeRoute();
  }

  function closeDirections() {
    dir.dest = null; dir.origin = null; dir.route = null; dir.waitingForMe = false; dir.seq++;
    dirEl.hidden = true;
    destMarker?.remove(); startMarker?.remove();
    clearRouteLayers();
    syncFromLabel();
  }

  function syncFromLabel() {
    dirFrom.textContent = dir.origin ? (dir.origin.name || 'Picked point') : 'Your location';
    dirUseMe.hidden = !dir.origin;
  }

  function summaryMsg(html) { dirSummary.innerHTML = html; dirSteps.innerHTML = ''; }

  async function computeRoute() {
    if (!dir.dest) return;
    syncFromLabel();
    const from = dir.origin || meLngLat;
    if (!from) {
      // No start yet: find the user (the my-location button flow), or let them pick one
      dir.waitingForMe = true;
      summaryMsg('<div class="msg">Finding your location… or <b>pick on map</b> to choose a start.</div>');
      if (watchId === null && navigator.geolocation) { following = false; startWatch(); setLocState('searching'); }
      return;
    }
    const seq = ++dir.seq;
    summaryMsg('<div class="msg">Finding the best route…</div>');
    const d = dir.dest;
    const params = new URLSearchParams({
      key: TT_KEY, travelMode: dir.mode, routeType: 'fastest', traffic: dir.mode === 'car' ? 'true' : 'false',
      instructionsType: 'text', language: 'en-GB', sectionType: 'traffic', computeTravelTimeFor: 'all'
    });
    // Starting from you while driving: tell TomTom which way you're heading so it doesn't
    // snap you onto the opposite side of a divided road
    if (!dir.origin && dir.mode === 'car' && meHeading !== null) params.set('vehicleHeading', String(Math.round(meHeading)));
    let data;
    try {
      const res = await fetch(`${TT}/routing/1/calculateRoute/${from.lat},${from.lng}:${d.lat},${d.lng}/json?${params}`);
      if (seq !== dir.seq) return; // a newer request replaced this one
      if (!res.ok) {
        const why = res.status === 403 ? 'the TomTom key was refused (check its allowed websites)'
                  : res.status === 429 ? 'the free daily limit was reached; try again later'
                  : res.status === 400 ? 'no route between these points'
                  : `TomTom returned error ${res.status}`;
        return summaryMsg(`<div class="err">Couldn't get a route: ${why}.</div>`);
      }
      data = await res.json();
    } catch {
      if (seq === dir.seq) summaryMsg('<div class="err">Couldn\'t reach TomTom. Check your connection and try ↻ Refresh.</div>');
      return;
    }
    if (seq !== dir.seq) return;
    const route = data.routes && data.routes[0];
    if (!route) return summaryMsg('<div class="err">No route found.</div>');
    dir.route = route;
    drawRoute(route, from);
    renderSummary(route);
    renderSteps(route);
  }

  // ---- Route drawing: blue line on the ground (under buildings), jams colored by severity ----
  const JAM_COLORS = ['#f5c542', '#f5a524', '#f97316', '#e5484d', '#8b1e1e']; // magnitudeOfDelay 0..4
  function clearRouteLayers() {
    for (const id of ['route-arrows', 'route-traffic', 'route-line', 'route-casing']) if (map.getLayer(id)) map.removeLayer(id);
    for (const id of ['route', 'route-traffic']) if (map.getSource(id)) map.removeSource(id);
  }
  function drawRoute(route, from) {
    const coords = route.legs.flatMap(l => l.points.map(pt => [pt.longitude, pt.latitude]));
    const jams = (route.sections || []).filter(s => s.sectionType === 'TRAFFIC').map(s => ({
      type: 'Feature', properties: { color: JAM_COLORS[Math.min(4, Math.max(0, s.magnitudeOfDelay ?? 1))] },
      geometry: { type: 'LineString', coordinates: coords.slice(s.startPointIndex, s.endPointIndex + 1) } }));
    clearRouteLayers();
    const dark = document.documentElement.dataset.theme === 'dark';
    map.addSource('route', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } } });
    map.addSource('route-traffic', { type: 'geojson', data: { type: 'FeatureCollection', features: jams } });
    const w = (a, b) => ['interpolate', ['exponential', 1.5], ['zoom'], 11, a, 18, b];
    map.addLayer({ id: 'route-casing', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' },
                   paint: { 'line-color': dark ? '#0b2a52' : '#ffffff', 'line-width': w(5, 22) } }, 'buildings');
    map.addLayer({ id: 'route-line', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' },
                   paint: { 'line-color': '#2f80ed', 'line-width': w(3, 14) } }, 'buildings');
    map.addLayer({ id: 'route-traffic', type: 'line', source: 'route-traffic', layout: { 'line-cap': 'round', 'line-join': 'round' },
                   paint: { 'line-color': ['get', 'color'], 'line-width': w(3, 14) } }, 'buildings');
    // Direction-of-travel chevrons along the route
    if (!map.hasImage('route-arrow')) {
      const S = 48, c = document.createElement('canvas'); c.width = c.height = S;
      const g = c.getContext('2d');
      g.strokeStyle = '#fff'; g.lineWidth = 7; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(S * 0.3, S * 0.22); g.lineTo(S * 0.68, S * 0.5); g.lineTo(S * 0.3, S * 0.78); g.stroke();
      map.addImage('route-arrow', g.getImageData(0, 0, S, S), { pixelRatio: 2 });
    }
    map.addLayer({ id: 'route-arrows', type: 'symbol', source: 'route',
      layout: { 'symbol-placement': 'line', 'symbol-spacing': ['interpolate', ['linear'], ['zoom'], 12, 60, 17, 90],
                'icon-image': 'route-arrow', 'icon-size': ['interpolate', ['linear'], ['zoom'], 11, 0.5, 14, 0.75, 17, 1.05],
                'icon-rotation-alignment': 'map', 'icon-pitch-alignment': 'map',
                'icon-allow-overlap': true, 'icon-ignore-placement': true },
      paint: { 'icon-opacity': 0.95 } }, 'buildings');
    // Custom start marker (only when not starting from your own position)
    if (dir.origin) {
      if (!startMarker) { const el = document.createElement('div'); el.className = 'start-pin'; startMarker = new maplibregl.Marker({ element: el }); }
      startMarker.setLngLat([from.lng, from.lat]).addTo(map);
    } else startMarker?.remove();
    // Frame the whole route, leaving room for the panel on wide screens
    const b = new maplibregl.LngLatBounds();
    coords.forEach(c => b.extend(c));
    const wide = innerWidth > 700;
    map.fitBounds(b, { padding: { top: 90, bottom: 60, left: wide ? 370 : 40, right: 60 }, maxZoom: 16.5,
                       pitch: Math.min(map.getPitch(), 50), duration: 1400 });
  }

  function fmtDuration(s) {
    const m = Math.round(s / 60);
    return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
  }
  function renderSummary(route) {
    const s = route.summary;
    const delay = dir.mode === 'car' ? (s.trafficDelayInSeconds || 0) : 0;
    const arrive = new Date(s.arrivalTime || Date.now() + s.travelTimeInSeconds * 1000)
      .toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const slow = delay >= 300;
    const delayTxt = dir.mode !== 'car' ? '' : delay >= 60 ? ` · <b>+${fmtDuration(delay)}</b> traffic` : ' · no traffic delays';
    dirSummary.innerHTML = `<div class="t${slow ? ' slow' : ''}">${fmtDuration(s.travelTimeInSeconds)}</div>
      <div class="sub">${fmtDist(s.lengthInMeters)} · arrive ${arrive}${delayTxt}</div>`;
  }

  const TURN_ICONS = {
    DEPART: '●', ARRIVE: '⚑', ARRIVE_LEFT: '⚑', ARRIVE_RIGHT: '⚑', STRAIGHT: '↑', KEEP_LEFT: '↖', KEEP_RIGHT: '↗',
    BEAR_LEFT: '↖', BEAR_RIGHT: '↗', TURN_LEFT: '←', TURN_RIGHT: '→', SHARP_LEFT: '↙', SHARP_RIGHT: '↘',
    MAKE_UTURN: '↶', ROUNDABOUT_CROSS: '⟳', ROUNDABOUT_LEFT: '⟲', ROUNDABOUT_RIGHT: '⟳', ROUNDABOUT_BACK: '⟲',
    ENTER_MOTORWAY: '↗', ENTER_FREEWAY: '↗', ENTER_HIGHWAY: '↗', TAKE_EXIT: '↘', MOTORWAY_CHANGE_LEFT: '↖',
    MOTORWAY_CHANGE_RIGHT: '↗', TAKE_FERRY: '⛴', SWITCH_PARALLEL_ROAD: '⇄', SWITCH_MAIN_ROAD: '⇄'
  };
  function renderSteps(route) {
    const ins = (route.guidance && route.guidance.instructions) || [];
    dirSteps.innerHTML = '';
    ins.forEach((it, i) => {
      const next = ins[i + 1];
      const legLen = next ? next.routeOffsetInMeters - it.routeOffsetInMeters : 0;
      const li = mk('li');
      li.append(mk('span', { className: 'ic', textContent: TURN_ICONS[it.maneuver] || '↑' }),
                mk('span', { className: 'm', textContent: it.message || it.maneuver }),
                mk('span', { className: 'd', textContent: legLen > 0 ? fmtDist(legLen) : '' }));
      li.onclick = () => map.flyTo({ center: [it.point.longitude, it.point.latitude], zoom: 17.5,
                                     pitch: Math.max(map.getPitch(), 55), duration: 1200, essential: true });
      dirSteps.append(li);
    });
  }

  // Panel controls
  document.getElementById('dirClose').onclick = closeDirections;
  document.getElementById('dirRefresh').onclick = () => computeRoute();
  dirEl.querySelectorAll('.dir-modes button').forEach(b => b.onclick = () => {
    dir.mode = b.dataset.mode;
    dirEl.querySelectorAll('.dir-modes button').forEach(x => x.classList.toggle('on', x === b));
    computeRoute();
  });
  dirPickStart.onclick = () => {
    setStatus('Click the map where the route should start', false, 6000);
    map.getCanvas().style.cursor = 'crosshair';
    placingMe = true; // reuse: stops pin-dropping from also firing on this click
    map.once('click', e => {
      placingMe = false;
      map.getCanvas().style.cursor = pinMode ? 'crosshair' : '';
      dir.origin = { lng: e.lngLat.lng, lat: e.lngLat.lat, name: 'Picked point' };
      setStatus('');
      computeRoute();
    });
  };
  dirUseMe.onclick = () => { dir.origin = null; computeRoute(); };

  // Right-click empty map: "Directions to here"
  let ctxPopup = null;
  map.on('contextmenu', e => {
    if (!TT_KEY || e.originalEvent?.target?.closest?.('.maplibregl-marker, .maplibregl-popup')) return;
    ctxPopup?.remove();
    const box = mk('div', { className: 'ctx-pop' });
    const b = mk('button', { textContent: 'Directions to here' });
    const at = { lng: e.lngLat.lng, lat: e.lngLat.lat };
    b.onclick = () => { ctxPopup.remove(); openDirections({ ...at, name: fmt(at.lat, at.lng) }); };
    box.append(b);
    ctxPopup = new maplibregl.Popup({ closeButton: false, offset: 6 }).setLngLat(e.lngLat).setDOMContent(box).addTo(map);
  });

  let tiltOn = true;
  document.getElementById('tilt').onclick = () => {
    tiltOn = !tiltOn;
    document.querySelectorAll('.tilt').forEach(el => el.style.display = tiltOn ? '' : 'none');
  };

  // ---- Theme button: Auto (follow system) -> Light -> Dark ----
  const themeBtn = document.getElementById('theme');
  const THEME_LABELS = { auto: '◐ Auto', light: '☀ Light', dark: '☾ Dark' };
  function applyTheme() {
    const name = effectiveTheme();
    T = MAP_THEMES[name];
    document.documentElement.dataset.theme = name;
    themeBtn.textContent = THEME_LABELS[themePref];
    themeBtn.title = themePref === 'auto' ? `Theme: Auto (following your system: ${name})` : `Theme: ${name}`;
    if (!map.isStyleLoaded()) return; // the 'load' handler applies it once the map is ready
    map.setPaintProperty('bg', 'background-color', T.land);
    map.setPaintProperty('water', 'fill-color', T.water);
    map.setPaintProperty('park', 'fill-color', T.park);
    map.setPaintProperty('roads', 'line-color', T.road);
    map.setPaintProperty('buildings', 'fill-extrusion-color', T.building);
    map.setLight(lightOf(T));
    map.setSky(skyOf(T));
    syncTraffic(); // traffic tiles have separate light/dark styles
    if (map.getLayer('route-casing')) map.setPaintProperty('route-casing', 'line-color', name === 'dark' ? '#0b2a52' : '#ffffff');
  }
  themeBtn.onclick = () => {
    themePref = { auto: 'light', light: 'dark', dark: 'auto' }[themePref] || 'auto';
    try { localStorage.setItem(THEME_KEY, themePref); } catch {}
    applyTheme();
  };
  darkQuery.addEventListener('change', () => { if (themePref === 'auto') applyTheme(); });
  map.on('load', applyTheme);
  applyTheme();
</script>
</body>
</html>
